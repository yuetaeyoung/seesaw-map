<style>
/* Layout: full-bleed custom-styled map; title card top-left, MV player bottom-left, park chips along the bottom.
   One committed look: lavender land, violet roads, deep-purple sea, burning seesaw markers. */
:root{
  --mist:#eceaf4; --land:#e6e3f0; --park:#cfe8c9; --road:#9a7cf2; --road-hi:#7d55ee; --sea:#4f2f9e;
  --ink:#24164d; --ink-soft:#5b4d86; --card:#ffffff; --line:#d9d3ee;
  --fire:#ff4d1c; --ember:#ffb000; --glow:rgb(255 90 30 / .45);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Figtree","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--mist);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:11px}

/* Title card */
.title{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  max-width:min(440px,calc(100vw - 32px));padding:20px 22px 18px;border-radius:22px;background:rgb(255 255 255 / .9);
  backdrop-filter:blur(10px);box-shadow:0 10px 40px rgb(36 22 77 / .18)}
.eyebrow{font:700 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--fire)}
.title h1{margin:10px 0 6px;font:900 clamp(26px,4.4vw,40px)/1.15 var(--serif);text-wrap:balance;letter-spacing:.02em}
.title h1 .bracket{color:var(--road-hi)}
.title p{margin:0;color:var(--ink-soft);font-size:14px}
.title .count{margin-top:12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.title .count b{font:900 22px/1 var(--serif);color:var(--fire)}
.title .count{flex-wrap:wrap}
.title .count .sub{font-weight:400;color:var(--ink-soft);font-size:12.5px;width:100%}
.credits{margin-top:10px;font-size:11.5px;color:var(--ink-soft);line-height:1.6}

/* MV player */
.player{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));
  width:300px;max-width:calc(100vw - 32px);border-radius:18px;overflow:hidden;background:var(--ink);color:#fff;box-shadow:0 10px 40px rgb(36 22 77 / .3)}
.player .screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.player .screen img,.player .screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.player .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent,rgb(0 0 0 / .45));border:0;cursor:pointer;color:#fff}
.player .play span{width:60px;height:60px;border-radius:50%;background:var(--fire);display:grid;place-items:center;box-shadow:0 0 0 8px rgb(255 77 28 / .25)}
.player .unmute{position:absolute;right:10px;bottom:10px;z-index:2;border:0;border-radius:999px;padding:7px 12px;background:var(--fire);color:#fff;font:700 12.5px var(--sans);cursor:pointer;box-shadow:0 0 0 6px rgb(255 77 28 / .25)}
.player .unmute[hidden]{display:none}
.player .offline-note{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:11.5px;background:rgb(0 0 0 / .6);color:#fff;text-align:center}
.player a.play{text-decoration:none}
.player .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:13px}
.player .meta a{color:var(--ember);font-weight:700;text-decoration:none;white-space:nowrap}
.player .meta a:focus-visible,.play:focus-visible,.chip:focus-visible,.fire:focus-visible{outline:3px solid var(--ember);outline-offset:3px}

/* Park chips */
.chips{position:fixed;z-index:5;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;overflow-x:auto;
  padding:4px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:0;background:var(--card);color:var(--ink);
  font:600 14px var(--sans);cursor:pointer;box-shadow:0 4px 16px rgb(36 22 77 / .16)}
.chip small{font-family:var(--serif);color:var(--ink-soft);font-size:13px}
.chip[hidden]{display:none}
.chip:hover,.chip.on{background:var(--ink);color:#fff}
.chip:hover small,.chip.on small{color:#cfc3ff}

/* Fire markers */
.fire-wrap{width:42px;height:52px}
.fire{display:block;width:42px;height:52px;border:0;padding:0;background:none;cursor:pointer;position:relative;transition:transform .15s;transform-origin:50% 100%}
.fire svg{position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 0 10px var(--glow))}
.fire .outer{transform-origin:21px 48px;animation:flick 1.6s ease-in-out infinite}
.fire .inner{transform-origin:21px 48px;animation:flick 1.1s ease-in-out infinite reverse}
.fire::after{content:"";position:absolute;left:50%;bottom:-6px;width:26px;height:9px;margin-left:-13px;border-radius:50%;
  background:radial-gradient(var(--glow),transparent 70%);animation:pulse 2s ease-in-out infinite}
.fire:hover,.fire.on{transform:scale(1.25)}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.94,1.07) rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}

/* Photo card */
.card{position:fixed;z-index:8;width:300px;max-width:calc(100vw - 32px);border-radius:20px;overflow:hidden;background:var(--card);
  box-shadow:0 18px 50px rgb(36 22 77 / .35);opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;transition:opacity .18s,transform .18s}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .photo{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--line)}
.card .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.card .photo img.on{opacity:1}
.card .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.card .dots i{width:7px;height:7px;border-radius:50%;background:rgb(255 255 255 / .55)}
.card .dots i.on{background:#fff}
.card .tag{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:999px;background:var(--fire);color:#fff;font:700 12px var(--sans)}
.card .tag.web{left:auto;right:12px;background:#fff;color:var(--ink);border:1.5px dashed var(--ink-soft)}
.card .tag.panel{background:var(--road-hi)}
.card .links{display:flex;gap:16px}
.fire-wrap.panel,.fire-wrap.panel .fire{width:26px;height:32px}
.fire-wrap.panel .fire svg{filter:hue-rotate(-75deg) saturate(1.2) drop-shadow(0 0 8px rgb(125 85 238 / .55))}
.fire-wrap.online .fire{opacity:.8}
.fire-wrap.online .fire::before{content:"";position:absolute;left:50%;bottom:-9px;width:34px;height:14px;margin-left:-17px;border-radius:50%;border:2px dashed var(--ink)}
.dot.panel{background:var(--road-hi)}
.dot.online{background:#fff;border:1.5px dashed var(--ink)}
.card .tag.single{background:var(--ember);color:var(--ink)}
.card .tag.both{background:linear-gradient(90deg,var(--ember),var(--fire))}
.card .nophoto{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:linear-gradient(160deg,#efe9ff,#ffe9dc);color:var(--ink-soft);font-size:13px;text-align:center;padding:24px}
.card .nophoto svg{width:84px;height:104px}
.card ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.card li{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#f1edff;color:var(--ink)}
.fire svg{width:100%;height:100%}
.fire-wrap.single,.fire-wrap.single .fire{width:30px;height:37px}
.fire-wrap.single .fire svg{filter:hue-rotate(28deg) saturate(1.15) drop-shadow(0 0 8px rgb(255 180 0 / .5))}
.filters{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;color:var(--ink);font:700 13px var(--sans);padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.filters button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--fire)}
.dot.single{background:var(--ember)}
.dot.both{background:linear-gradient(90deg,var(--ember) 50%,var(--fire) 50%)}
.card .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px}
.card h2{margin:0;font:700 18px/1.25 var(--sans)}
.card .zh{font:700 15px var(--serif);color:var(--ink-soft)}
.card .addr{margin-top:6px;font-size:13.5px;color:var(--ink);display:flex;gap:6px}
.card .addr svg{flex:none;margin-top:3px}
.card .note{font-size:12px;color:var(--ink-soft)}
.card a{margin-top:8px;align-self:flex-start;color:var(--road-hi);font-weight:700;font-size:13px;text-decoration:none}

.addbtn{margin-top:12px;width:100%;border:0;border-radius:14px;padding:11px 14px;background:var(--fire);color:#fff;font:700 15px var(--sans);cursor:pointer;box-shadow:0 6px 18px rgb(255 77 28 / .3)}
.addbtn:hover{filter:brightness(1.06)}
.addbtn[hidden],.adminlink[hidden],.adminbar[hidden],.filters button[hidden]{display:none}
.adminlink{border:0;background:none;color:var(--ink-soft);font:600 11.5px var(--sans);text-decoration:underline;cursor:pointer;padding:0;margin-left:10px}
.adminbar{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:#fff;background:var(--ink);padding:8px 12px;border-radius:12px}
.adminbar button{margin-left:auto;border:0;background:#fff;color:var(--ink);border-radius:999px;padding:3px 10px;font:700 12px var(--sans);cursor:pointer}
.panel{position:fixed;z-index:12;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:360px;max-width:calc(100vw - 32px);
  max-height:calc(100% - 32px);overflow:auto;background:#fff;border-radius:22px;padding:20px 20px 18px;box-shadow:0 18px 50px rgb(36 22 77 / .35)}
.panel h3{margin:0 0 6px;font:900 22px/1.2 var(--serif)}
.panel .hint{margin:0 0 12px;font-size:13px;color:var(--ink-soft)}
.panel form{display:flex;flex-direction:column;gap:12px}
.panel label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.panel input:not([type=radio]),.panel textarea{font:15px var(--sans);color:var(--ink);padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#faf9fd;width:100%}
.panel input:not([type=radio]):focus,.panel textarea:focus{outline:none;border-color:var(--road-hi)}
.panel textarea{resize:vertical}
.panel .search{display:flex;gap:6px}
.panel .search input{flex:1;min-width:0}
.panel fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.panel legend{font-size:13px;font-weight:700;margin-bottom:5px;padding:0}
.panel .opt{flex-direction:row;align-items:center;gap:6px;font-weight:600;padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer}
.panel .opt:has(input:checked){border-color:var(--ink);background:#f1edff}
.results{display:flex;flex-direction:column;gap:4px}
.results button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font:13px/1.35 var(--sans);color:var(--ink);cursor:pointer}
.results button:hover{border-color:var(--road-hi);background:#f6f3ff}
.results p{margin:0;font-size:13px;color:var(--ink-soft)}
.pinstate{font-size:12.5px;color:var(--ink-soft);background:#f6f3ff;border-radius:10px;padding:8px 10px}
.pinstate.ok{color:var(--ink);background:#e9f7e6}
.btn{border:0;border-radius:12px;padding:10px 16px;font:700 14px var(--sans);cursor:pointer}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:#f1edff;color:var(--ink)}
.btn.danger{background:#d93025;color:#fff}
.btn.approve{background:#1f8a4c;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.addbtn:focus-visible,.adminlink:focus-visible,.results button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{margin:0;font-size:13px;min-height:1em}
.msg.err{color:#c62828}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.toast{position:fixed;z-index:30;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.card .admin-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;font-weight:700}
.card .admin-row .btn{padding:7px 12px;font-size:12.5px}
.card .tag.fan{background:#ffe3ef;color:#a3134f;border:1.5px solid #f48fb1}
.card .tag.pending{top:auto;bottom:12px;background:#fff3cd;color:#6b4e00}
.fire-wrap.fan .fire::before{content:"";position:absolute;left:50%;bottom:-8px;width:32px;height:13px;margin-left:-16px;border-radius:50%;border:2.5px solid #f06292}
.fire-wrap.pending .fire{opacity:.5}
.fire-wrap.draft .fire{cursor:grab}
.fire-wrap.draft .fire::before{content:"";position:absolute;left:50%;bottom:-10px;width:40px;height:16px;margin-left:-20px;border-radius:50%;border:3px solid var(--ink);animation:pulse 1.2s ease-in-out infinite}
.dot.fan{background:#f06292}
@media (max-width:640px){.panel{top:auto;bottom:0;right:0;left:0;width:auto;max-width:none;max-height:78%;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}

/* Lyric cursor */
.lyric{position:fixed;z-index:20;left:0;top:0;pointer-events:none;white-space:nowrap;font:700 17px/1 var(--serif);color:var(--ink);
  padding:7px 12px;border-radius:999px;background:rgb(255 255 255 / .82);box-shadow:0 4px 14px rgb(36 22 77 / .15);
  transform-origin:0 50%;transition:opacity .35s}
.lyric.fade{opacity:0}
@media (hover:none){.lyric{display:none}}
@media (max-width:640px){
  .title{padding:16px 18px 14px}
  .credits{display:none}
  .player{width:220px;bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.fire .outer,.fire .inner,.fire::after{animation:none}.card,.lyric{transition:none}}
</style>
</head>

<script>
// ── Settings ────────────────────────────────────────────────────────────────
// YouTube video ID of the MV. News coverage embeds both VXj8Ddcr7FM and BieU27o2JJY; use the official one.
const YOUTUBE_ID = "VXj8Ddcr7FM";
// Lines shown beside the cursor, one at a time. Either fill this list, or leave it empty and put a file
// called lyrics.txt (one line per row) in the same folder as this page; the page reads it when online.
const LYRICS = [];
// Where added seesaws are saved: the site's own Netlify function. Change only if you host the function elsewhere.
const SHEET_API_URL = "/api";

// type: "duo" = two or more riders facing each other (seesaw, sway boat, saddle mate, multi-seat rocker),

  <path class="inner" fill="url(#fi)" d="M21 47c-4.6 0-8-3.2-8-7.6 0-4 2.6-6.6 4.6-9 1.4-1.8 2.2-4 2-6.8 4.6 2.6 9.4 7.6 9.4 14 0 5.2-3.4 9.4-8 9.4z"/>
</svg>`;
const card = document.getElementById("card"), chips = document.getElementById("chips");
const panel = document.getElementById("panel"), toastEl = document.getElementById("toast");
const TYPES = ["duo", "single", "both", "panel"];
const TYPE_LABEL = { duo: "雙人 Duo", single: "單人 Single", both: "單人＋雙人 Single & Duo", panel: "遊戲板 Play panels" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const abs = f => /^https?:/i.test(f) ? f : LCSD + f;
const photoSrc = id => `${API_URL.replace(/\/$/, "")}/photo/${encodeURIComponent(id)}`;
const inHK = (lat, lon) => lat > 22.1 && lat < 22.6 && lon > 113.8 && lon < 114.5;
PARKS.forEach(p => { p.id = "b-" + p.en.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); });

let API_URL = SHEET_API_URL, sheetRows = [], entries = [], filter = "all";
let admin = false, adminPw = "", placing = false, draft = null, editing = null;
let current = null, hideTimer = 0, cycleTimer = 0, pinned = false;

// Built-in parks, then the saved rows: a row with a built-in id edits or hides that park;
// any other row is a seesaw someone added.
function applyRow(p, r) {
  const q = { ...p, status: r.status || "live" };
  for (const k of ["en", "zh", "district", "addr", "note"]) if (r[k] !== "" && r[k] != null) q[k] = String(r[k]);
  if (r.lat !== "" && r.lon !== "" && inHK(+r.lat, +r.lon)) { q.lat = +r.lat; q.lon = +r.lon; }
  if (TYPES.includes(r.type)) q.type = r.type;
  if (r.items) q.items = String(r.items).split(/\n|\|/).map(s => s.trim()).filter(Boolean);
  if (/^p-[0-9a-f-]{36}$/.test(r.photo || "")) q.photos = [photoSrc(r.photo), ...p.photos];
  return q;
}
function merge() {
  const rows = new Map(sheetRows.map(r => [String(r.id), r]));
  const out = [];
  for (const b of PARKS) {
    const base = { ...b, photos: b.photos.map(abs), builtin: true, status: "live" };
    const r = rows.get(b.id);
    rows.delete(b.id);
    if (!r) { out.push(base); continue; }
    if (r.status === "deleted") continue;
    out.push(applyRow(base, r));
  }
  for (const r of rows.values()) {
    if (r.status === "deleted" || (r.status === "pending" && !admin)) continue;
    const q = applyRow({ id: String(r.id), en: "", zh: "", district: "", addr: "", type: "duo", items: [], photos: [], fan: true }, r);
    if (q.lat != null && (q.en || q.addr)) out.push(q);
  }
  return out;
}
const visible = p => {
  if (filter === "all") return true;
  if (filter === "online") return !!p.online;
  if (filter === "fan") return !!p.fan;
  if (p.online) return false;
  return p.type === filter || (p.type === "both" && filter !== "panel");
};
function applyFilter() {
  entries.forEach(p => { const s = visible(p); p.wrap.style.display = s ? "" : "none"; p.chip.hidden = !s; });
}
function recount() {
  const live = entries.filter(p => p.status !== "pending"), base = live.filter(p => !p.online);
  document.getElementById("nduo").textContent = base.filter(p => p.type === "duo" || p.type === "both").length;
  document.getElementById("nsingle").textContent = base.filter(p => p.type === "single" || p.type === "both").length;
  document.getElementById("npanel").textContent = base.filter(p => p.type === "panel").length;
  const nOnline = live.filter(p => p.online).length, nFan = live.filter(p => p.fan).length;
  document.getElementById("countsub").textContent = `LCSD parks · ${nOnline} online finds${nFan ? ` · ${nFan} added by fans 網友新增` : ""}`;
  const nPending = entries.filter(p => p.status === "pending").length;
  document.getElementById("pendingnote").textContent = nPending ? ` · ${nPending} 待審批 waiting for approval` : "";
}

function draw() {
  entries.forEach(p => p.marker?.remove());
  closeCard();
  entries = merge();
  chips.innerHTML = "";
  for (const p of entries) {
    const wrap = document.createElement("div");
    wrap.className = ["fire-wrap", p.type, p.online && "online", p.fan && "fan", p.status === "pending" && "pending"].filter(Boolean).join(" ");
    const el = document.createElement("button");
    el.className = "fire"; el.type = "button"; el.innerHTML = FLAME;
    el.setAttribute("aria-label", `${p.en} ${p.zh}: ${TYPE_LABEL[p.type]}`);
    wrap.appendChild(el);
    el.addEventListener("mouseenter", () => showCard(p));
    el.addEventListener("mouseleave", hideSoon);
    el.addEventListener("focus", () => showCard(p));
    el.addEventListener("blur", hideSoon);
    el.addEventListener("click", e => { e.stopPropagation(); pinned = true; showCard(p); });
    p.marker = new maplibregl.Marker({ element: wrap, anchor: "bottom" }).setLngLat([p.lon, p.lat]).addTo(map);
    p.el = el; p.wrap = wrap;

    const c = document.createElement("button");
    c.className = "chip"; c.type = "button";
    c.innerHTML = `<i class="dot ${p.fan ? "fan" : p.online ? "online" : p.type}"></i>${esc((p.en || p.addr).replace(/ \(.*\)/, ""))} <small>${esc(p.zh.replace(/（.*）/, ""))}</small>`;
    c.addEventListener("click", () => {
      pinned = true;
      map.flyTo({ center: [p.lon, p.lat], zoom: 15.5, duration: 1400 });
      map.once("moveend", () => showCard(p));
    });
    chips.appendChild(c);
    p.chip = c;
  }
  applyFilter(); recount();
}

function showCard(p) {
  if (placing) return;
  clearTimeout(hideTimer);
  if (current !== p) {
    current = p;
    const noPhoto = p.online ? "No photo we can show yet. See the source below." : p.fan ? "No photo added yet." : "LCSD hasn't published a photo of this playground yet.";
    const adminRow = admin ? `<div class="admin-row">
        ${p.status === "pending" ? `<button type="button" class="btn approve" data-act="approve">批准 Approve</button>` : ""}
        <button type="button" class="btn primary" data-act="edit">編輯 Edit</button>
        <button type="button" class="btn danger" data-act="delete">刪除 Delete</button></div>` : "";
    card.innerHTML = `<div class="photo">${p.photos.length ? p.photos.map((f, i) => `<img src="${esc(f)}" alt="${esc(p.en)} play equipment photo ${i + 1}" class="${i ? "" : "on"}">`).join("") : `<div class="nophoto">${FLAME}<span>${noPhoto}</span></div>`}
        <span class="tag ${p.type}">${TYPE_LABEL[p.type]}</span>${p.online ? `<span class="tag web">網上搜尋 Online search</span>` : ""}${p.fan ? `<span class="tag web fan">網友新增 Fan added</span>` : ""}
        ${p.status === "pending" ? `<span class="tag pending">待審批 Waiting for approval</span>` : ""}
        ${p.photos.length > 1 ? `<div class="dots">${p.photos.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}</div>
      <div class="info"><h2>${esc(p.en || p.addr)}</h2>${p.zh ? `<div class="zh">${esc(p.zh)}</div>` : ""}
        ${p.addr ? `<div class="addr"><svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M6 15s5-5.2 5-9A5 5 0 0 0 1 6c0 3.8 5 9 5 9z" fill="${css("--fire")}"/><circle cx="6" cy="6" r="2" fill="#fff"/></svg><span>${esc(p.addr)}${p.district ? " · " + esc(p.district) : ""}</span></div>` : ""}
        ${p.items.length ? `<ul>${p.items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
        ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
        <div class="links">${p.source ? `<a href="${esc(p.source)}" target="_blank" rel="noopener">Source 來源 ↗</a>` : ""}<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">Directions 路線 ↗</a></div>
        ${adminRow}</div>`;
    clearInterval(cycleTimer);
    if (p.photos.length > 1) {
      let i = 0;
      cycleTimer = setInterval(() => {
        const imgs = card.querySelectorAll(".photo img"), dots = card.querySelectorAll(".dots i");
        i = (i + 1) % imgs.length;
        imgs.forEach((im, j) => im.classList.toggle("on", j === i));
        dots.forEach((d, j) => d.classList.toggle("on", j === i));
      }, 2200);
    }
  }
  document.querySelectorAll(".fire").forEach(f => f.classList.toggle("on", f === p.el));
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === p.chip));
  place(p);
  card.classList.add("show");
}
function place(p) {
  const pt = map.project([p.lon, p.lat]), w = card.offsetWidth, h = card.offsetHeight || 420, m = 16;
  let x = pt.x - w / 2, y = pt.y - h - 40;
  if (y < m) y = pt.y + 30;
  x = Math.max(m, Math.min(innerWidth - w - m, x));
  y = Math.max(m, Math.min(innerHeight - h - m, y));
  card.style.left = x + "px"; card.style.top = y + "px";
}
function closeCard() {
  clearTimeout(hideTimer); clearInterval(cycleTimer);
  card.classList.remove("show"); document.querySelectorAll(".fire,.chip").forEach(e => e.classList.remove("on"));
  current = null; pinned = false;
}
function hideSoon() {
  if (pinned) return;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(closeCard, 220);
}
card.addEventListener("mouseenter", () => clearTimeout(hideTimer));
card.addEventListener("mouseleave", hideSoon);
map.on("move", () => { if (current) place(current); });
map.on("click", e => {
  if (placing) { setDraft([e.lngLat.lng, e.lngLat.lat]); return; }
  closeCard();
});

document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  applyFilter(); closeCard();
}));

function toast(text) {
  toastEl.textContent = text; toastEl.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove("show"), 3800);
}

// ── Saving: the site's Netlify function (the admin password is checked there, never in this page) ──
async function api(body) {
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({ ok: false, error: "The server didn't answer properly. Try again in a moment." }));
  if (!d.ok) throw new Error(d.error || "Something went wrong.");
  return d;
}
async function loadRows() {
  if (!API_URL) return;
  try {
    if (admin) sheetRows = (await api({ action: "list", password: adminPw })).rows || [];
    else sheetRows = (await (await fetch(API_URL + "?action=list")).json()).rows || [];
  } catch (e) {
    if (admin && /password/i.test(e.message)) { logout(); toast("Please log in again. 請重新登入"); return; }
    toast("Couldn't load the added seesaws right now.");
  }
  draw();
}

// ── Finding an address: Hong Kong government address search first, then OpenStreetMap ──
async function geocode(q) {
  const out = [];
  try {
    const r = await fetch(`https://www.als.gov.hk/lookup?q=${encodeURIComponent(q)}&n=5`, { headers: { Accept: "application/json" } });
    const d = await r.json();
    for (const s of d.SuggestedAddress || []) {
      const pa = s.Address?.PremisesAddress || {};
      const g = [].concat(pa.GeospatialInformation || [])[0] || {};
      const lat = +g.Latitude, lon = +g.Longitude;
      if (!inHK(lat, lon)) continue;
      const e = pa.EngPremisesAddress || {}, c = pa.ChiPremisesAddress || {};
      const en = [e.BuildingName, [e.EngStreet?.BuildingNoFrom, e.EngStreet?.StreetName].filter(Boolean).join(" ")].filter(Boolean).join(", ");
      const zh = [c.ChiStreet?.StreetName, c.ChiStreet?.BuildingNoFrom && c.ChiStreet.BuildingNoFrom + "號", c.BuildingName].filter(Boolean).join("");
      out.push({ label: [en, zh].filter(Boolean).join(" · ") || q, lat, lon });
    }
  } catch {}
  if (out.length) return out;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=hk&limit=5&accept-language=zh-HK,en&q=${encodeURIComponent(q)}`);
    for (const x of await r.json()) { const lat = +x.lat, lon = +x.lon; if (inHK(lat, lon)) out.push({ label: x.display_name, lat, lon }); }
  } catch {}
  return out;
}
async function shrink(file) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1200 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", .82).split(",")[1];
}

// ── The add / edit / admin login panel ──
function setDraft(lngLat) {
  if (!draft) {
    const w = document.createElement("div");
    w.className = "fire-wrap draft duo";
    w.innerHTML = `<div class="fire">${FLAME}</div>`;
    draft = new maplibregl.Marker({ element: w, anchor: "bottom", draggable: true }).setLngLat(lngLat).addTo(map);
    draft.on("dragend", pinState);
  } else draft.setLngLat(lngLat);
  pinState();
}
function pinState() {
  const el = panel.querySelector("#pinstate");
  if (!el) return;
  if (!draft) { el.textContent = "未有位置 No location yet: search above, or tap the map."; el.className = "pinstate"; return; }
  const { lat, lng } = draft.getLngLat();
  el.textContent = `位置已設定 Location set (${lat.toFixed(5)}, ${lng.toFixed(5)}). Drag the flame to adjust.`;
  el.className = "pinstate ok";
}
function closePanel() {
  panel.hidden = true; panel.innerHTML = "";
  placing = false; editing = null;
  draft?.remove(); draft = null;
}
function openLogin() {
  closePanel(); closeCard();
  panel.hidden = false;
  panel.innerHTML = `<h3>管理員登入 Admin</h3><p class="hint">Log in to edit, delete or approve entries.</p>
    <form id="loginform"><label>密碼 Password<input type="password" id="pw" autocomplete="current-password" required></label>
    <div class="btnrow"><button class="btn primary">登入 Log in</button><button type="button" class="btn ghost" data-close>取消 Cancel</button></div>
    <p class="msg" id="msg" role="status"></p></form>`;
  panel.querySelector("#pw").focus();
  panel.querySelector("#loginform").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = panel.querySelector("#pw").value, msg = panel.querySelector("#msg"), btn = e.target.querySelector(".primary");
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Checking…";
    try {
      await api({ action: "login", password: pw });
      admin = true; adminPw = pw;
      try { sessionStorage.setItem("seesaw-admin", pw); } catch {}
      document.getElementById("adminbar").hidden = false;
      closePanel(); toast("已登入 Logged in as admin"); loadRows();
    } catch (err) { msg.className = "msg err"; msg.textContent = err.message; btn.disabled = false; }
  });
}
function logout() {
  admin = false; adminPw = "";
  try { sessionStorage.removeItem("seesaw-admin"); } catch {}
  document.getElementById("adminbar").hidden = true;
  closePanel(); loadRows();
}
function openEntry(p) {
  closePanel(); closeCard();
  editing = p || null;
  const isEdit = !!p, a = admin && isEdit;
  const types = a ? TYPES : ["duo", "single", "panel"];
  const t = p?.type || "duo";
  panel.hidden = false;
  panel.innerHTML = `<h3>${isEdit ? "編輯 Edit entry" : "新增搖搖板 Add a seesaw"}</h3>
    <p class="hint">${isEdit ? "Change any field, search a new address or drag the flame to move it." : "Search the address or park, then drag the flame to the exact spot. You can also tap the map."}</p>
    <form id="entryform" novalidate>
      <label>地址或地點 Address or place
        <span class="search"><input id="f-addr" maxlength="200" placeholder="e.g. 石硤尾公園 or 1 Cherry Street" value="${esc(p?.addr || "")}"><button type="button" class="btn ghost" id="find">搜尋 Find</button></span></label>
      <div class="results" id="results"></div>
      <div class="pinstate" id="pinstate"></div>
      <label>名稱 Place name<input id="f-en" maxlength="120" placeholder="e.g. Shek Kip Mei Park" value="${esc(p?.en || "")}"></label>
      ${a ? `<label>中文名稱 Chinese name<input id="f-zh" maxlength="80" value="${esc(p.zh)}"></label>
      <label>地區 District<input id="f-district" maxlength="60" value="${esc(p.district)}"></label>` : ""}
      <fieldset><legend>類型 Type</legend>${types.map(k => `<label class="opt"><input type="radio" name="type" value="${k}" ${k === t ? "checked" : ""}>${TYPE_LABEL[k]}</label>`).join("")}</fieldset>
      <label>有甚麼 What's there${a ? " (one per line)" : ""}<textarea id="f-items" rows="2" maxlength="${a ? 600 : 200}" placeholder="e.g. Seesaw, sway boat">${esc((p?.items || []).join("\n"))}</textarea></label>
      ${a ? `<label>備註 Note<input id="f-note" maxlength="300" value="${esc(p.note || "")}"></label>` : ""}
      <label>相片 Photo (optional)<input type="file" id="f-photo" accept="image/*"></label>
      <input class="hp" id="f-web" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="btnrow"><button class="btn primary" id="save">${isEdit ? "儲存 Save" : "加入地圖 Add to map"}</button><button type="button" class="btn ghost" data-close>取消 Cancel</button></div>
      <p class="msg" id="msg" role="status"></p>
    </form>`;
  placing = true;
  if (p) setDraft([p.lon, p.lat]); else pinState();
  const $ = s => panel.querySelector(s);
  const find = async () => {
    const q = $("#f-addr").value.trim(), box = $("#results");
    if (!q) { box.innerHTML = `<p>Type an address or place name first.</p>`; return; }
    box.innerHTML = `<p>Searching…</p>`;
    const found = await geocode(q);
    if (!found.length) { box.innerHTML = `<p>No match. Try other wording, or tap the map to place it yourself.</p>`; return; }
    box.innerHTML = "";
    found.forEach(f => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = f.label;
      b.addEventListener("click", () => {
        setDraft([f.lon, f.lat]);
        if (!$("#f-addr").value.trim() || $("#f-addr").value.trim() === q) $("#f-addr").value = f.label;
        map.flyTo({ center: [f.lon, f.lat], zoom: 17, duration: 1200 });
        box.innerHTML = "";
      });
      box.appendChild(b);
    });
  };
  $("#find").addEventListener("click", find);
  $("#f-addr").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); find(); } });
  $("#entryform").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("#msg"), btn = $("#save");
    const err = t => { msg.className = "msg err"; msg.textContent = t; };
    if (!draft) return err("Set the location first: search the address, or tap the map.");
    const en = $("#f-en").value.trim(), addr = $("#f-addr").value.trim();
    if (!en && !addr) return err("Add a place name or an address.");
    const { lat, lng } = draft.getLngLat();
    if (!inHK(lat, lng)) return err("That spot isn't in Hong Kong. Drag the flame onto the right place.");
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
    try {
      const file = $("#f-photo").files[0];
      const photo = file ? await shrink(file) : "";
      const type = panel.querySelector("input[name=type]:checked")?.value || "duo";
      const items = $("#f-items").value.trim();
      if (editing) {
        await api({ action: "save", password: adminPw, photo, row: { id: editing.id, en, addr, lat, lon: lng, type, items,
          zh: $("#f-zh")?.value.trim() || "", district: $("#f-district")?.value.trim() || "", note: $("#f-note")?.value.trim() || "" } });
        closePanel(); toast("已儲存 Saved"); loadRows();
      } else {
        const d = await api({ action: "add", en, addr, lat, lon: lng, type, items, photo, website: $("#f-web").value });
        closePanel();
        toast(d.status === "pending" ? "多謝！審核後會顯示 Thanks! It will show after a quick check." : "已加入地圖 Added to the map!");
        await loadRows();
        const added = entries.find(x => x.id === d.id);
        if (added) { pinned = true; map.flyTo({ center: [added.lon, added.lat], zoom: 16, duration: 1200 }); map.once("moveend", () => showCard(added)); }
      }
    } catch (x) { err(x.message); btn.disabled = false; }
  });
}
panel.addEventListener("click", e => { if (e.target.closest("[data-close]")) closePanel(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden) closePanel(); });

// Admin buttons inside the photo card
card.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b || !current) return;
  const p = current, act = b.dataset.act, row = b.closest(".admin-row");
  if (act === "edit") return openEntry(p);
  if (act === "delete") {
    row.innerHTML = `<span>刪除？Delete this entry?</span><button type="button" class="btn danger" data-act="confirm-delete">確定 Yes, delete</button><button type="button" class="btn ghost" data-act="cancel">取消 Cancel</button>`;
    return;
  }
  if (act === "cancel") { current = null; return showCard(p); }
  b.disabled = true;
  try {
    if (act === "confirm-delete") { await api({ action: "delete", password: adminPw, id: p.id }); toast("已刪除 Deleted"); }
    if (act === "approve") { await api({ action: "approve", password: adminPw, id: p.id }); toast("已批准 Approved"); }
    loadRows();
  } catch (x) { toast(x.message); b.disabled = false; }
});

document.getElementById("addbtn").addEventListener("click", () => openEntry(null));
document.getElementById("adminlink").addEventListener("click", openLogin);
document.getElementById("logout").addEventListener("click", logout);

draw();

  loadRows();
})();

// ── Music video: starts by itself, muted (browsers allow nothing louder before a visitor interacts);
//    the sound comes on at the visitor's first click or key press anywhere on the page. ──
const screen = document.getElementById("screen");
document.getElementById("yt").href = `https://www.youtube.com/watch?v=${YOUTUBE_ID}`;
const isFile = location.protocol === "file:";
screen.innerHTML = isFile
  ? `<img src="https://i.ytimg.com/vi/${YOUTUBE_ID}/hqdefault.jpg" alt="〈在搖搖板上相對的我們〉 music video">
     <a class="play" href="https://www.youtube.com/watch?v=${YOUTUBE_ID}" target="_blank" rel="noopener" aria-label="Watch the MV on YouTube"><span><svg width="22" height="24" viewBox="0 0 22 24" aria-hidden="true"><path d="M3 2l17 10L3 22z" fill="#fff"/></svg></span></a>
     <div class="offline-note">The MV plays here once this page is online</div>`
  : `<div id="ytplayer"></div><button class="unmute" id="unmute" type="button">開聲 Sound on</button>`;
let player = null, soundOn = false;
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("ytplayer", {
    videoId: YOUTUBE_ID,
    playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, loop: 1, playlist: YOUTUBE_ID },
    events: { onReady: e => { e.target.mute(); e.target.playVideo(); } }
  });
};
if (!isFile) {
  const ytApi = document.createElement("script");
  ytApi.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(ytApi);
}
const soundUp = () => {
  if (soundOn || !player?.unMute) return;
  player.unMute(); player.setVolume(80); player.playVideo();
  soundOn = true;
  document.getElementById("unmute").hidden = true;
};
addEventListener("pointerdown", soundUp);
addEventListener("keydown", soundUp);

// ── Lyric cursor: one line at a time beside the pointer, tilting like a seesaw as you move ──
const lyric = document.getElementById("lyric");
let lines = LYRICS.slice();
let idx = 0, tx = 0, ty = 0, x = 0, y = 0, tilt = 0, lastX = 0, active = false;
lyric.textContent = lines[0] || "";
if (!lines.length) {
  lyric.hidden = true;
  fetch("lyrics.txt").then(r => r.ok ? r.text() : "").then(t => {
    lines = t.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (lines.length) { idx = 0; lyric.textContent = lines[0]; lyric.hidden = false; }
  }).catch(() => {});
}
addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  tx = e.clientX + 18; ty = e.clientY + 20;
  tilt = Math.max(-9, Math.min(9, (e.clientX - lastX) * .6));
  lastX = e.clientX;
  if (!active) { active = true; x = tx; y = ty; lyric.classList.remove("fade"); }
});
document.addEventListener("mouseleave", () => { active = false; lyric.classList.add("fade"); });
setInterval(() => {
  if (!active) return;
  lyric.classList.add("fade");
  setTimeout(() => { if (!lines.length) return; idx = (idx + 1) % lines.length; lyric.textContent = lines[idx]; lyric.classList.remove("fade"); }, 350);
}, 3200);
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
(function tick() {
  x += (tx - x) * .18; y += (ty - y) * .18; tilt *= .9;
  lyric.style.transform = `translate(${x}px, ${y}px) rotate(${still ? 0 : tilt}deg)`;
  requestAnimationFrame(tick);
})();
</script>
</body>
