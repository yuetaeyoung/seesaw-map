<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>在搖搖板上相對的我們 · 香港搖搖板地圖</title>
<meta name="description" content="炎明熹〈在搖搖板上相對的我們〉— a map of the seesaws in Hong Kong's parks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: full-bleed custom-styled map; title card top-left, MV player bottom-left, park chips along the bottom.
   One committed look: lavender land, violet roads, deep-purple sea, burning seesaw markers. */
:root{
  --mist:#eceaf4; --land:#e6e3f0; --park:#cfe8c9; --road:#9a7cf2; --road-hi:#7d55ee; --sea:#4f2f9e;
  --ink:#24164d; --ink-soft:#5b4d86; --card:#ffffff; --line:#d9d3ee;
  --fire:#ff4d1c; --ember:#ffb000; --glow:rgb(255 90 30 / .45);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Figtree","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--mist);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:11px}

/* Title card */
.title{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  max-width:min(440px,calc(100vw - 32px));padding:20px 22px 18px;border-radius:22px;background:rgb(255 255 255 / .9);
  backdrop-filter:blur(10px);box-shadow:0 10px 40px rgb(36 22 77 / .18)}
.eyebrow{font:700 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--fire)}
.title h1{margin:10px 0 6px;font:900 clamp(26px,4.4vw,40px)/1.15 var(--serif);text-wrap:balance;letter-spacing:.02em}
.title h1 .bracket{color:var(--road-hi)}
.title p{margin:0;color:var(--ink-soft);font-size:14px}
.title .count{margin-top:12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.title .count b{font:900 22px/1 var(--serif);color:var(--fire)}
.title .count{flex-wrap:wrap}
.title .count .sub{font-weight:400;color:var(--ink-soft);font-size:12.5px;width:100%}
.credits{margin-top:10px;font-size:11.5px;color:var(--ink-soft);line-height:1.6}

/* MV player */
.player{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));
  width:300px;max-width:calc(100vw - 32px);border-radius:18px;overflow:hidden;background:var(--ink);color:#fff;box-shadow:0 10px 40px rgb(36 22 77 / .3)}
.player .screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.player .screen img,.player .screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.player .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent,rgb(0 0 0 / .45));border:0;cursor:pointer;color:#fff}
.player .play span{width:60px;height:60px;border-radius:50%;background:var(--fire);display:grid;place-items:center;box-shadow:0 0 0 8px rgb(255 77 28 / .25)}
.player .unmute{position:absolute;right:10px;bottom:10px;z-index:2;border:0;border-radius:999px;padding:7px 12px;background:var(--fire);color:#fff;font:700 12.5px var(--sans);cursor:pointer;box-shadow:0 0 0 6px rgb(255 77 28 / .25)}
.player .unmute[hidden]{display:none}
.player .unmute.off{background:rgb(0 0 0 / .55);box-shadow:none}
.player .offline-note{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:11.5px;background:rgb(0 0 0 / .6);color:#fff;text-align:center}
.player a.play{text-decoration:none}
.player .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:13px}
.player .meta a{color:var(--ember);font-weight:700;text-decoration:none;white-space:nowrap}
.player .meta a:focus-visible,.play:focus-visible,.chip:focus-visible,.fire:focus-visible{outline:3px solid var(--ember);outline-offset:3px}

/* Park chips */
.chips{position:fixed;z-index:5;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;overflow-x:auto;
  padding:4px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:0;background:var(--card);color:var(--ink);
  font:600 14px var(--sans);cursor:pointer;box-shadow:0 4px 16px rgb(36 22 77 / .16)}
.chip small{font-family:var(--serif);color:var(--ink-soft);font-size:13px}
.chip[hidden]{display:none}
.chip:hover,.chip.on{background:var(--ink);color:#fff}
.chip:hover small,.chip.on small{color:#cfc3ff}

/* Fire markers */
.fire-wrap{width:42px;height:52px}
.fire{display:block;width:42px;height:52px;border:0;padding:0;background:none;cursor:pointer;position:relative;transition:transform .15s;transform-origin:50% 100%}
.fire svg{position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 0 10px var(--glow))}
.fire .outer{transform-origin:21px 48px;animation:flick 1.6s ease-in-out infinite}
.fire .inner{transform-origin:21px 48px;animation:flick 1.1s ease-in-out infinite reverse}
.fire::after{content:"";position:absolute;left:50%;bottom:-6px;width:26px;height:9px;margin-left:-13px;border-radius:50%;
  background:radial-gradient(var(--glow),transparent 70%);animation:pulse 2s ease-in-out infinite}
.fire:hover,.fire.on{transform:scale(1.25)}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.94,1.07) rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}

/* Photo card */
.card{position:fixed;z-index:8;width:300px;max-width:calc(100vw - 32px);border-radius:20px;overflow:hidden;background:var(--card);
  box-shadow:0 18px 50px rgb(36 22 77 / .35);opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;transition:opacity .18s,transform .18s}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .photo{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--line)}
.card .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.card .photo img.on{opacity:1}
.card .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.card .dots i{width:7px;height:7px;border-radius:50%;background:rgb(255 255 255 / .55)}
.card .dots i.on{background:#fff}
.card .tag{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:999px;background:var(--fire);color:#fff;font:700 12px var(--sans)}
.card .tag.web{left:auto;right:12px;background:#fff;color:var(--ink);border:1.5px dashed var(--ink-soft)}
.card .tag.panel{background:var(--road-hi)}
.card .links{display:flex;gap:16px}
.fire-wrap.panel,.fire-wrap.panel .fire{width:26px;height:32px}
.fire-wrap.panel .fire svg{filter:hue-rotate(-75deg) saturate(1.2) drop-shadow(0 0 8px rgb(125 85 238 / .55))}
.fire-wrap.online .fire{opacity:.8}
.fire-wrap.online .fire::before{content:"";position:absolute;left:50%;bottom:-9px;width:34px;height:14px;margin-left:-17px;border-radius:50%;border:2px dashed var(--ink)}
.dot.panel{background:var(--road-hi)}
.dot.online{background:#fff;border:1.5px dashed var(--ink)}
.card .tag.single{background:var(--ember);color:var(--ink)}
.card .tag.both{background:linear-gradient(90deg,var(--ember),var(--fire))}
.card .nophoto{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:linear-gradient(160deg,#efe9ff,#ffe9dc);color:var(--ink-soft);font-size:13px;text-align:center;padding:24px}
.card .nophoto svg{width:84px;height:104px}
.card ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.card li{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#f1edff;color:var(--ink)}
.fire svg{width:100%;height:100%}
.fire-wrap.single,.fire-wrap.single .fire{width:30px;height:37px}
.fire-wrap.single .fire svg{filter:hue-rotate(28deg) saturate(1.15) drop-shadow(0 0 8px rgb(255 180 0 / .5))}
.filters{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;color:var(--ink);font:700 13px var(--sans);padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.filters button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--fire)}
.dot.single{background:var(--ember)}
.dot.both{background:linear-gradient(90deg,var(--ember) 50%,var(--fire) 50%)}
.card .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px}
.card h2{margin:0;font:700 18px/1.25 var(--sans)}
.card .zh{font:700 15px var(--serif);color:var(--ink-soft)}
.card .addr{margin-top:6px;font-size:13.5px;color:var(--ink);display:flex;gap:6px}
.card .addr svg{flex:none;margin-top:3px}
.card .note{font-size:12px;color:var(--ink-soft)}
.card a{margin-top:8px;align-self:flex-start;color:var(--road-hi);font-weight:700;font-size:13px;text-decoration:none}

.addbtn{margin-top:12px;width:100%;border:0;border-radius:14px;padding:11px 14px;background:var(--fire);color:#fff;font:700 15px var(--sans);cursor:pointer;box-shadow:0 6px 18px rgb(255 77 28 / .3)}
.addbtn:hover{filter:brightness(1.06)}
.addbtn[hidden],.adminlink[hidden],.adminbar[hidden],.filters button[hidden]{display:none}
.adminlink{position:fixed;z-index:6;right:max(6px,env(safe-area-inset-right,0px));bottom:calc(2px + env(safe-area-inset-bottom,0px));border:0;background:none;color:#fff;opacity:.45;font:500 9px/1 var(--sans);letter-spacing:.04em;cursor:pointer;padding:2px 3px}
.adminlink:hover{opacity:.9}
.adminbar{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:#fff;background:var(--ink);padding:8px 12px;border-radius:12px}
.adminbar button{margin-left:auto;border:0;background:#fff;color:var(--ink);border-radius:999px;padding:3px 10px;font:700 12px var(--sans);cursor:pointer}
.editor{position:fixed;z-index:12;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:360px;max-width:calc(100vw - 32px);
  max-height:calc(100% - 32px);overflow:auto;background:#fff;border-radius:22px;padding:20px 20px 18px;box-shadow:0 18px 50px rgb(36 22 77 / .35)}
.editor h3{margin:0 0 6px;font:900 22px/1.2 var(--serif)}
.editor .hint{margin:0 0 12px;font-size:13px;color:var(--ink-soft)}
.editor form{display:flex;flex-direction:column;gap:12px}
.editor label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.editor input:not([type=radio]),.editor textarea{font:15px var(--sans);color:var(--ink);padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#faf9fd;width:100%}
.editor input:not([type=radio]):focus,.editor textarea:focus{outline:none;border-color:var(--road-hi)}
.editor textarea{resize:vertical}
.editor .search{display:flex;gap:6px}
.editor .search input{flex:1;min-width:0}
.editor fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.editor legend{font-size:13px;font-weight:700;margin-bottom:5px;padding:0}
.editor .opt{flex-direction:row;align-items:center;gap:6px;font-weight:600;padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer}
.editor .opt:has(input:checked){border-color:var(--ink);background:#f1edff}
.results{display:flex;flex-direction:column;gap:4px}
.results button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font:13px/1.35 var(--sans);color:var(--ink);cursor:pointer}
.results button:hover{border-color:var(--road-hi);background:#f6f3ff}
.results p{margin:0;font-size:13px;color:var(--ink-soft)}
.pinstate{font-size:12.5px;color:var(--ink-soft);background:#f6f3ff;border-radius:10px;padding:8px 10px}
.pinstate.ok{color:var(--ink);background:#e9f7e6}
.btn{border:0;border-radius:12px;padding:10px 16px;font:700 14px var(--sans);cursor:pointer}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:#f1edff;color:var(--ink)}
.btn.danger{background:#d93025;color:#fff}
.btn.approve{background:#1f8a4c;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.addbtn:focus-visible,.adminlink:focus-visible,.results button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{margin:0;font-size:13px;min-height:1em}
.msg.err{color:#c62828}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.toast{position:fixed;z-index:30;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.card .admin-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;font-weight:700}
.card .admin-row .btn{padding:7px 12px;font-size:12.5px}
.card .tag.fan{background:#ffe3ef;color:#a3134f;border:1.5px solid #f48fb1}
.card .tag.pending{top:auto;bottom:12px;background:#fff3cd;color:#6b4e00}
.fire-wrap.fan .fire::before{content:"";position:absolute;left:50%;bottom:-8px;width:32px;height:13px;margin-left:-16px;border-radius:50%;border:2.5px solid #f06292}
.fire-wrap.pending .fire{opacity:.5}
.fire-wrap.draft .fire{cursor:grab}
.fire-wrap.draft .fire::before{content:"";position:absolute;left:50%;bottom:-10px;width:40px;height:16px;margin-left:-20px;border-radius:50%;border:3px solid var(--ink);animation:pulse 1.2s ease-in-out infinite}
.dot.fan{background:#f06292}
@media (max-width:640px){.editor{top:auto;bottom:0;right:0;left:0;width:auto;max-width:none;max-height:78%;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}

.timing-now{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px;background:#f6f3ff;margin-bottom:12px}
.timing-now small{color:var(--ink-soft);font-weight:700;font-size:12.5px}
.timing-now b{font:900 20px/1.35 var(--serif);min-height:1.35em}
.btn.tm-mark{background:var(--fire);color:#fff}
.editor .btnrow + .btnrow,.editor label + .btnrow{margin-top:12px}
.editor #tm-outwrap{margin-top:12px}

.card .cap{position:absolute;left:10px;right:10px;bottom:24px;font-size:11.5px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgb(0 0 0 / .7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cap a{color:#fff;margin:0;font-size:11.5px;text-decoration:underline}
.card .cap:empty{display:none}
.card .posts{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:150px;overflow:auto}
.card .post p{margin:0;font:600 13.5px/1.45 var(--serif);color:var(--ink)}
.card .post span{font:600 12px var(--sans);color:var(--ink-soft)}
.card .post span a{margin:0;font-size:12px}
.card .post em{font-style:normal;color:#8a6200;background:#fff3cd;border-radius:6px;padding:0 5px}
.card .pact{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.card .pact .btn{padding:4px 9px;font-size:11.5px}
.card .addhere{margin-top:10px;width:100%;background:var(--fire);color:#fff;padding:9px 12px;font-size:13.5px}
.card .near{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.card .near div{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .near .btn{padding:5px 10px;font-size:12px;flex:none}
.editor .here{align-self:flex-start;padding:8px 12px;font-size:13px}
.editor .at{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#faf9fd;padding-left:11px}
.editor .at span{font-weight:700;color:var(--ink-soft)}
.editor .at input{border:0!important;background:none!important;padding-left:4px!important}
.editor .joinopt{flex-direction:row;align-items:flex-start;gap:8px;border-radius:12px;border-color:var(--fire);background:#fff3ee;font-size:13px;line-height:1.4}
.editor .joinopt input{margin-top:3px}
.editor [hidden]{display:none!important}

/* Lyric cursor */
.lyric{position:fixed;z-index:20;left:0;top:0;pointer-events:none;white-space:nowrap;font:700 17px/1 var(--serif);color:var(--ink);
  padding:7px 12px;border-radius:999px;background:rgb(255 255 255 / .82);box-shadow:0 4px 14px rgb(36 22 77 / .15);
  transform-origin:0 50%;transition:opacity .2s}
.lyric.fade{opacity:0}
@media (hover:none){.lyric{display:none}}
@media (max-width:640px){
  .title{padding:16px 18px 14px}
  .credits{display:none}
  .player{width:220px;bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.fire .outer,.fire .inner,.fire::after{animation:none}.card,.lyric{transition:none}}
</style>
</head>

</section>

<nav class="chips" id="chips" aria-label="Parks with a seesaw"></nav>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

};

const FALLBACK_STYLE = {
  version: 8,
  sources: { carto: { type: "raster", tileSize: 256, attribution: "© OpenStreetMap contributors © CARTO",

};

const ATTRIBUTION = { compact: true, customAttribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Photos © LCSD' };

const FLAME = `<svg viewBox="0 0 42 52" width="42" height="52" aria-hidden="true">
  <path class="outer" fill="url(#fo)" d="M21 49c-9.5 0-16-6.4-16-15.2 0-6.6 3.8-11 7.4-15.4 2.6-3.2 4.7-7.4 4-14.4 6.2 3 10.8 9.4 10.8 16.6 1.8-1.4 2.8-3.6 3-6 4.4 4.2 6.8 10 6.8 15.6C37 43 30.6 49 21 49z"/>
  <path class="inner" fill="url(#fi)" d="M21 47c-4.6 0-8-3.2-8-7.6 0-4 2.6-6.6 4.6-9 1.4-1.8 2.2-4 2-6.8 4.6 2.6 9.4 7.6 9.4 14 0 5.2-3.4 9.4-8 9.4z"/>
</svg>`;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const abs = f => /^https?:/i.test(f) ? f : LCSD + f;
const inHK = (lat, lon) => lat > 22.1 && lat < 22.6 && lon > 113.8 && lon < 114.5;
const ID_PHOTO = /^p-[0-9a-f-]{36}$/;
const photoSrc = id => `${API_URL.replace(/\/$/, "")}/photo/${encodeURIComponent(id)}`;
const igHandle = s => String(s || "").trim().replace(/^@+/, "").replace(/[^A-Za-z0-9._]/g, "").slice(0, 30);
const igLink = h => `https://www.instagram.com/${encodeURIComponent(h)}/`;
const distM = (a, b) => { const r = Math.PI / 180, x = (b.lon - a.lon) * r * Math.cos((a.lat + b.lat) / 2 * r), y = (b.lat - a.lat) * r; return Math.hypot(x, y) * 6371e3; };
const nameOf = p => p.en || p.zh || p.addr || "This seesaw";
PARKS.forEach(p => { p.id = "b-" + p.en.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); });

let API_URL = SHEET_API_URL, apiOn = false, sheetRows = [], entries = [], filter = "all";
let admin = false, adminPw = "", placing = false, draft = null, onPin = null;
let current = null, hideTimer = 0, cycleTimer = 0, pinned = false;

// Every saved row is a "post". A post with a `spot` belongs to that seesaw (its photo and message show there);
// a post without one is a new seesaw. Rows with a built-in park's id edit or hide that park.
function fromRow(base, r) {
  const q = { ...base, status: r.status || "live", spot: String(r.spot || "") };
  for (const k of ["en", "zh", "district", "addr", "note"]) if (r[k] !== "" && r[k] != null) q[k] = String(r[k]);
  if (r.lat !== "" && r.lon !== "" && inHK(+r.lat, +r.lon)) { q.lat = +r.lat; q.lon = +r.lon; }
  if (r.items && base.builtin) q.items = String(r.items).split(/\n|\|/).map(s => s.trim()).filter(Boolean);
  return q;
}
function merge() {
  const rows = new Map(sheetRows.map(r => [String(r.id), r]));
  const nodes = new Map();
  for (const b of PARKS) {
    let e = { ...b, builtin: true, status: "live", spot: "", items: b.items.slice(), posts: [],
      photos: b.photos.map(f => ({ src: abs(f), credit: "LCSD 康文署" })) };
    const r = rows.get(b.id);
    rows.delete(b.id);
    if (r) {
      if (r.status === "deleted") continue;
      e = fromRow(e, r);
      if (ID_PHOTO.test(r.photo || "")) e.photos.unshift({ src: photoSrc(r.photo), credit: "" });
    }
    nodes.set(e.id, e);
  }
  for (const r of rows.values()) {
    if (r.status === "deleted" || (r.status === "pending" && !admin)) continue;
    const e = fromRow({ id: String(r.id), en: "", zh: "", district: "", addr: "", items: [], photos: [], posts: [], fan: true }, r);
    const post = { id: e.id, ig: igHandle(r.ig), credit: String(r.credit || ""), message: String(r.message || ""), status: e.status, photo: ID_PHOTO.test(r.photo || "") };
    if (post.photo) e.photos.push({ src: photoSrc(r.photo), credit: post.credit, ig: post.ig });
    e.posts.push(post);
    if (e.lat != null) nodes.set(e.id, e);
  }
  // Follow "merged into" links to the seesaw that shows on the map; a loop of merges settles on one of them.
  const rootOf = e => {
    const path = [e];
    let x = e;
    while (x.spot && nodes.has(x.spot)) {
      const next = nodes.get(x.spot), at = path.indexOf(next);
      if (at >= 0) return path.slice(at).sort((a, b) => a.id < b.id ? -1 : 1)[0];
      path.push(next); x = next;
    }
    return x;
  };
  const out = [];
  for (const e of nodes.values()) if (rootOf(e) === e) out.push(e);
  for (const e of nodes.values()) {
    const r = rootOf(e);
    if (r !== e) { r.photos.push(...e.photos); r.posts.push(...e.posts); if (e.fan) r.fanPosts = true; }
  }
  return out.filter(e => e.en || e.zh || e.addr);
}
const hasFans = p => p.fan || p.fanPosts;
const visible = p => {
  if (filter === "all") return true;
  if (filter === "online") return !!p.online;
  if (filter === "fan") return hasFans(p);
  if (filter === "lcsd") return p.builtin && !p.online;
  return true;
};
function applyFilter() {
  entries.forEach(p => { const s = visible(p); p.wrap.style.display = s ? "" : "none"; p.chip.hidden = !s; });
}
function recount() {
  const live = entries.filter(p => p.status !== "pending");
  document.getElementById("nall").textContent = live.length;
  const nL = live.filter(p => p.builtin && !p.online).length, nO = live.filter(p => p.online).length, nF = live.filter(p => p.fan).length;
  const nPhotos = live.reduce((a, p) => a + p.posts.filter(x => x.photo && x.status !== "pending").length, 0);
  document.getElementById("countsub").textContent = `${nL} LCSD parks · ${nO} online finds${nF ? ` · ${nF} added by fans` : ""}${nPhotos ? ` · ${nPhotos} fan photos 網友相片` : ""}`;
  const nPending = entries.reduce((a, p) => a + p.posts.filter(x => x.status === "pending").length, 0);
  document.getElementById("pendingnote").textContent = nPending ? ` · ${nPending} 待審批 waiting for approval` : "";
}

function draw() {
  entries.forEach(p => p.marker?.remove());
  closeCard();
  entries = merge();
  chips.innerHTML = "";
  for (const p of entries) {
    const wrap = document.createElement("div");
    wrap.className = ["fire-wrap duo", p.online && "online", hasFans(p) && "fan", p.status === "pending" && "pending"].filter(Boolean).join(" ");
    const el = document.createElement("button");
    el.className = "fire"; el.type = "button"; el.innerHTML = FLAME;
    el.setAttribute("aria-label", `${nameOf(p)} ${p.zh}: 雙人搖搖板 two-person seesaw`);
    wrap.appendChild(el);
    el.addEventListener("mouseenter", () => showCard(p));
    el.addEventListener("mouseleave", hideSoon);
    el.addEventListener("focus", () => showCard(p));
    el.addEventListener("blur", hideSoon);
    el.addEventListener("click", e => { e.stopPropagation(); pinned = true; showCard(p); });
    p.marker = new maplibregl.Marker({ element: wrap, anchor: "bottom" }).setLngLat([p.lon, p.lat]).addTo(map);
    p.el = el; p.wrap = wrap;

    const c = document.createElement("button");
    c.className = "chip"; c.type = "button";
    c.innerHTML = `<i class="dot ${hasFans(p) ? "fan" : p.online ? "online" : "duo"}"></i>${esc(nameOf(p).replace(/ \(.*\)/, ""))} <small>${esc(p.zh.replace(/（.*）/, ""))}</small>`;
    c.addEventListener("click", () => {
      pinned = true;
      map.flyTo({ center: [p.lon, p.lat], zoom: 15.5, duration: 1400 });
      map.once("moveend", () => showCard(p));
    });
    chips.appendChild(c);
    p.chip = c;
  }
  applyFilter(); recount();
}

const caption = ph => !ph || (!ph.credit && !ph.ig) ? "" :
  `相片 Photo: ${esc(ph.credit)}${ph.ig ? `${ph.credit ? " · " : ""}<a href="${igLink(ph.ig)}" target="_blank" rel="noopener">@${esc(ph.ig)}</a>` : ""}`;
function showCard(p) {
  if (placing) return;
  clearTimeout(hideTimer);
  if (current !== p) {
    current = p;
    const ph = p.photos;
    const noPhoto = p.online ? "No photo we can show yet. See the source below." : p.fan ? "No photo yet. Add one!" : "LCSD hasn't published a photo of this playground yet.";
    const posts = p.posts.filter(x => x.message || admin);
    const near = admin ? entries.filter(o => o !== p && distM(o, p) < 150).sort((a, b) => distM(a, p) - distM(b, p)) : [];
    const postActs = x => !admin || x.id === p.id ? "" : `<span class="pact">${x.status === "pending" ? `<button type="button" class="btn approve" data-act="approve" data-id="${x.id}">批准 Approve</button>` : ""}<button type="button" class="btn ghost" data-act="split" data-id="${x.id}">分開 Split off</button><button type="button" class="btn danger" data-act="delete" data-id="${x.id}">刪除 Delete</button></span>`;

function place(p) {
  const pt = map.project([p.lon, p.lat]), w = card.offsetWidth, h = card.offsetHeight || 420, m = 16;
  let x = pt.x - w / 2, y = pt.y - h - 40;
  if (y < m) y = pt.y + 30;
  x = Math.max(m, Math.min(innerWidth - w - m, x));
  y = Math.max(m, Math.min(innerHeight - h - m, y));
  card.style.left = x + "px"; card.style.top = y + "px";
}

  clearTimeout(hideTimer); clearInterval(cycleTimer);

// ── Finding an address: Hong Kong government address search first, then OpenStreetMap ──
async function geocode(q) {
  const out = [];
  try {
    const r = await fetch(`https://www.als.gov.hk/lookup?q=${encodeURIComponent(q)}&n=5`, { headers: { Accept: "application/json" } });
    const d = await r.json();
    for (const s of d.SuggestedAddress || []) {
      const pa = s.Address?.PremisesAddress || {};
      const g = [].concat(pa.GeospatialInformation || [])[0] || {};
      const lat = +g.Latitude, lon = +g.Longitude;
      if (!inHK(lat, lon)) continue;
      const e = pa.EngPremisesAddress || {}, c = pa.ChiPremisesAddress || {};
      const en = [e.BuildingName, [e.EngStreet?.BuildingNoFrom, e.EngStreet?.StreetName].filter(Boolean).join(" ")].filter(Boolean).join(", ");
      const zh = [c.ChiStreet?.StreetName, c.ChiStreet?.BuildingNoFrom && c.ChiStreet.BuildingNoFrom + "號", c.BuildingName].filter(Boolean).join("");
      out.push({ label: [en, zh].filter(Boolean).join(" · ") || q, lat, lon });
    }
  } catch {}
  if (out.length) return out;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=hk&limit=5&accept-language=zh-HK,en&q=${encodeURIComponent(q)}`);
    for (const x of await r.json()) { const lat = +x.lat, lon = +x.lon; if (inHK(lat, lon)) out.push({ label: x.display_name, lat, lon }); }
  } catch {}
  return out;
}
async function shrink(file) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1200 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", .82).split(",")[1];
}

    playerVars: { autoplay: 1, playsinline: 1, rel: 0, loop: 1, playlist: YOUTUBE_ID },
    events: {
      onReady: e => {
        e.target.unMute(); e.target.setVolume(80); e.target.playVideo();
        // If the browser blocked sound, the video doesn't start: play it silently instead.
        setTimeout(() => {
          const playing = e.target.getPlayerState() === YT.PlayerState.PLAYING && !e.target.isMuted();
          if (playing) { soundOn = true; heardOnce = true; }
          else { e.target.mute(); e.target.playVideo(); soundOn = false; }
          showSound();
        }, 1200);
      }
    }
  });
};
if (!isFile) {
  const ytApi = document.createElement("script");
  ytApi.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(ytApi);
}
soundBtn?.addEventListener("click", e => {
  e.stopPropagation();
  if (soundOn) { userMuted = true; soundDown(); } else { userMuted = false; soundUp(true); }
});
// First click or key press anywhere turns the sound on (unless the visitor chose Sound off).
const firstTouch = e => {
  if (soundOn || userMuted || heardOnce || e.target === soundBtn) return;
  soundUp(true);
};
addEventListener("pointerdown", firstTouch);
addEventListener("keydown", firstTouch);

// ── Lyric cursor ──
// Lines in lyrics.txt can start with a time like [01:23.45]; each line then shows when the MV reaches that moment.
// Lines without times rotate every few seconds. Add #timing to the end of the site address to record the times.
const lyric = document.getElementById("lyric");
const TAG = /\[(\d+):(\d+(?:\.\d+)?)\]/g;
let plain = [], timed = [], curText = "", idx = 0, tx = 0, ty = 0, x = 0, y = 0, tilt = 0, lastX = 0, active = false;
function parseLyrics(text) {
  plain = []; timed = [];
  for (const raw of String(text).split(/\r?\n/)) {
    const tags = [...raw.matchAll(TAG)];
    const line = raw.replace(TAG, "").trim();
    if (!line) continue;
    plain.push(line);
    tags.forEach(m => timed.push({ t: +m[1] * 60 + +m[2], line }));
  }
  timed.sort((a, b) => a.t - b.t);
  idx = 0;
  setLine(timed.length ? "" : plain[0] || "");
}
function setLine(text) {
  if (text === curText) return;
  curText = text;
  lyric.classList.add("fade");
  setTimeout(() => { lyric.textContent = curText; lyric.classList.toggle("fade", !(active && curText)); }, timed.length ? 80 : 250);
}
parseLyrics(LYRICS.join("\n"));
const lyricsReady = plain.length ? Promise.resolve() :
  fetch("lyrics.txt", { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(parseLyrics).catch(() => {});

// Untimed: next line every 3.2 s. Timed: follow the MV's playback position.
setInterval(() => {
  if (timed.length || !plain.length || !active) return;
  idx = (idx + 1) % plain.length;
  setLine(plain[idx]);
}, 3200);
setInterval(() => {
  if (!timed.length || !player?.getCurrentTime) return;
  const t = player.getCurrentTime() + 0.25;
  let i = -1;
  for (let k = 0; k < timed.length && timed[k].t <= t; k++) i = k;
  setLine(i >= 0 ? timed[i].line : "");
}, 150);

addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  lyric.style.visibility = e.target.closest?.(".editor, .card") ? "hidden" : "";
  tx = e.clientX + 18; ty = e.clientY + 20;
  tilt = Math.max(-9, Math.min(9, (e.clientX - lastX) * .6));
  lastX = e.clientX;
  if (!active) { active = true; x = tx; y = ty; lyric.classList.toggle("fade", !curText); }
});
document.addEventListener("mouseleave", () => { active = false; lyric.classList.add("fade"); });
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
(function tick() {
  x += (tx - x) * .18; y += (ty - y) * .18; tilt *= .9;
  lyric.style.transform = `translate(${x}px, ${y}px) rotate(${still ? 0 : tilt}deg)`;
  requestAnimationFrame(tick);
})();

// ── Lyric timing tool (open the site with #timing at the end of the address) ──
const fmtTime = t => `${String(Math.floor(t / 60)).padStart(2, "0")}:${(t % 60).toFixed(2).padStart(5, "0")}`;
function openTiming() {
  closePanel(); closeCard();
  panel.hidden = false;
  if (!plain.length) {
    panel.innerHTML = `<h3>歌詞對時 Lyric timing</h3><p class="hint">Put the lyrics into lyrics.txt first, one line per row, then open this page again.</p>
      <div class="btnrow"><button type="button" class="btn ghost" data-close>關閉 Close</button></div>`;
    return;
  }
  const lines = plain.slice();
  let marks = [];
  panel.innerHTML = `<h3>歌詞對時 Lyric timing</h3>
    <p class="hint">Press Start and the MV plays from the beginning with sound. Each time a line starts being sung, press the Space bar (or the orange button). Late on one? Press Undo and catch the next.</p>
    <div class="timing-now"><small id="tm-count"></small><b id="tm-next"></b></div>
    <div class="btnrow"><button type="button" class="btn primary" id="tm-start">開始 Start</button>
      <button type="button" class="btn tm-mark" id="tm-mark" disabled>下一句 Next line (Space)</button>
      <button type="button" class="btn ghost" id="tm-undo" disabled>Undo</button></div>
    <label id="tm-outwrap" hidden>完成 Done. Copy this and paste it over everything in lyrics.txt<textarea id="tm-out" rows="8" readonly></textarea></label>
    <div class="btnrow"><button type="button" class="btn primary" id="tm-copy" hidden>複製 Copy</button><button type="button" class="btn ghost" data-close>關閉 Close</button></div>
    <p class="msg" id="tm-msg" role="status"></p>`;
  const $ = s => panel.querySelector(s), msg = $("#tm-msg");
  const update = () => {
    $("#tm-count").textContent = marks.length < lines.length ? `Line ${marks.length + 1} of ${lines.length}: press at the start of` : `All ${lines.length} lines timed`;
    $("#tm-next").textContent = lines[marks.length] || "";
    $("#tm-undo").disabled = !marks.length;
  };
  const finish = () => {
    const out = lines.map((l, i) => `[${fmtTime(marks[i])}]${l}`).join("\n");
    $("#tm-out").value = out;
    $("#tm-outwrap").hidden = false; $("#tm-copy").hidden = false; $("#tm-mark").disabled = true;
    parseLyrics(out);
    msg.className = "msg"; msg.textContent = "The cursor now follows these times on this page, so you can check them while the MV plays.";
  };
  $("#tm-start").addEventListener("click", () => {
    if (!player?.seekTo) { msg.className = "msg err"; msg.textContent = "The MV isn't ready yet. Wait a few seconds and press Start again."; return; }
    marks = [];
    player.seekTo(0, true); player.unMute(); player.setVolume(80); player.playVideo();
    soundOn = true; heardOnce = true; userMuted = false; showSound();
    $("#tm-mark").disabled = false; $("#tm-outwrap").hidden = true; $("#tm-copy").hidden = true;
    msg.textContent = ""; $("#tm-start").textContent = "重來 Restart";
    update();
  });
  const mark = () => {
    if ($("#tm-mark").disabled) return;
    marks.push(player.getCurrentTime());
    update();
    if (marks.length === lines.length) finish();
  };
  $("#tm-mark").addEventListener("click", mark);
  $("#tm-undo").addEventListener("click", () => { marks.pop(); $("#tm-mark").disabled = false; $("#tm-outwrap").hidden = true; $("#tm-copy").hidden = true; update(); });
  $("#tm-copy").addEventListener("click", () => {
    const ta = $("#tm-out");
    navigator.clipboard.writeText(ta.value).then(() => { msg.className = "msg"; msg.textContent = "Copied 已複製"; })
      .catch(() => { ta.select(); msg.className = "msg"; msg.textContent = "Press Cmd+C (or Ctrl+C) to copy."; });
  });
  update();
}
addEventListener("keydown", e => {
  if (e.code !== "Space" || panel.hidden || e.target.matches("input, textarea")) return;
  const b = panel.querySelector("#tm-mark");
  if (!b) return;
  e.preventDefault();
  b.click();
});
if (location.hash === "#timing") lyricsReady.then(openTiming);
</script>
</body>
</html>
